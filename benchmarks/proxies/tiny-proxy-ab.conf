# tiny-proxy config for the A/B benchmark (run_ab.sh).
# Same routing as tiny-proxy.conf, but on the "new version" ports so both
# versions can run side by side and be measured back-to-back without
# container restarts.
localhost:8090 {
    handle_path /text/* {
        reverse_proxy backend:9000
    }
    handle_path /json/* {
        reverse_proxy backend-json:9000
    }
}

localhost:8446 {
    tls /etc/ssl/tiny-proxy/cert.pem /etc/ssl/tiny-proxy/key.pem
    handle_path /text/* {
        reverse_proxy backend:9000
    }
    handle_path /json/* {
        reverse_proxy backend-json:9000
    }
}
