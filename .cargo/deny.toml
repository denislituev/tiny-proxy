# cargo-deny configuration (0.18+ format)
#
# NOTE: cargo-deny does not auto-discover this path — CI invokes it as
#       `cargo deny check --config .cargo/deny.toml`.

[advisories]
yanked = "deny"

# rustls-pemfile is archived — replacement is rustls-pki-types PemObject (1.9+).
# Only used in tests/dev-deps; migration tracked separately.
[[advisories.ignore]]
id = "RUSTSEC-2025-0134"

[licenses]
# Encountered licenses only (verified via `cargo deny --target all list`):
# wasi/wit-bindgen crates carry Apache-2.0 WITH LLVM-exception; r-efi's
# LGPL-2.1-or-later option is satisfied via the MIT/Apache alternatives.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "deny"
